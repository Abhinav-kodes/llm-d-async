ap:
  imagePullPolicy: Never
  concurrency: 1
  drainTimeout: "5s"
  otel:
    endpoint: ""
    insecure: true
    sampler: "always_on"
    samplerArg: "1.0"
    redisTracing: false
  transport: redis-sortedset
  transportConfig:
    result_queue_name: "hardkill-result-list"
    poll_interval_ms: 500
    batch_size: 10
    # Short lease and fast reclaim so takeover after the force deletion is
    # quick enough for CI.
    claim_lease_ttl_seconds: 5
    claim_reclaim_interval_ms: 500
    queues:
      - queue_name: "hardkill-request-sortedset"
        request_path_url: "/v1/completions"
        igw_base_url: "http://envoy.e2e-integration.svc.cluster.local:8081"
  metrics:
    enabled: true
    port: 9090
    secure: false
  redis:
    url: "redis://redis.e2e-integration.svc.cluster.local:6379"
  modelServerMonitor:
    enabled: false
